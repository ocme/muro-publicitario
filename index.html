<!DOCTYPE html>
<html lang="es">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B166XHKPTQ"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-B166XHKPTQ');
</script>

<meta charset="UTF-8">
<title>Muro Publicitario</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

/* GENERAL */
body{
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    background: #111;
    color: white;
}

/* BOTÓN */
.top-button{
    position: fixed;
    top: 20px;
    right: 20px;
    background: #00ff88;
    color: black;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    z-index: 1000;
}

/* TÍTULO */
h1{
    margin-top: 80px;
    color: #00ff88;
    font-size: 26px;
}

.subtitle{
    font-size: 14px;
    color: #aaa;
}

.description{
    max-width: 650px;
    margin: 15px auto;
    font-size: 14px;
    color: #ccc;
    line-height: 1.6;
}

.price{
    background: #00ff88;
    color: black;
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
    margin-top: 10px;
    font-size: 12px;
}

#visitas{
    margin-top: 10px;
    font-size: 13px;
    color: #00ff88;
}

/* GRID */
.grid{
    display: grid;
    grid-template-columns: repeat(10, 100px);
    gap: 6px;
    justify-content: center;
    margin-top: 30px;
}

/* CUADROS */
.ad{
    width: 100px;
    height: 100px;
    background: #333;
    border: 1px solid #555;
    overflow: hidden;
    cursor: pointer;
}

.ad img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.available{
    background: #1e1e1e;
    color: #00ff88;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 🔥 PREVIEW MEJORADO */
.preview{
    position: fixed;
    display: none;
    pointer-events: none;
    z-index: 9999;
}

.preview img{
    width: auto;
    height: auto;
    max-width: 500px;
    max-height: 500px;
    object-fit: contain; /* 🔥 muestra TODA la imagen */
    border: 3px solid #00ff88;
    border-radius: 12px;
    background: black;
    box-shadow: 0 0 30px rgba(0,255,136,0.7);
}

</style>
</head>

<body>

<a class="top-button"
href="https://wa.me/573014207972?text=Hola%2C%20quiero%20comprar%20un%20espacio"
target="_blank">
Comprar espacio
</a>

<h1>📍 Anuncia tu negocio aquí</h1>
<p class="subtitle">Visibilidad directa • Sin intermediarios • Bajo costo</p>

<div class="price">Espacios desde $10.000 COP</div>

<p id="visitas">Cargando visitas...</p>

<p class="description">
Directorio visual donde cada anuncio lleva tráfico directo a tu negocio.
</p>

<div class="grid">

<a href="https://wa.me/573014207972" class="ad"
onclick="gtag('event','click_anuncio',{event_category:'ads'});">
<img src="https://i.imgur.com/DfUFSE1.jpeg">
</a>

<a href="https://instagram.com" class="ad">
<img src="https://via.placeholder.com/100">
</a>

<a href="https://google.com" class="ad">
<img src="https://via.placeholder.com/100">
</a>

<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">
<img id="preview-img">
</div>

<!-- VISITAS -->
<script>
let visitas = localStorage.getItem("visitas") || 0;
visitas++;
localStorage.setItem("visitas", visitas);
document.getElementById("visitas").innerText =
"👀 Visitas: " + visitas;
</script>

<!-- PREVIEW SCRIPT -->
<script>
const preview = document.getElementById("preview");
const previewImg = document.getElementById("preview-img");

document.querySelectorAll(".ad img").forEach(img => {

    img.addEventListener("mouseenter", () => {
        preview.style.display = "block";
        previewImg.src = img.src;
    });

    img.addEventListener("mousemove", (e) => {

        let x = e.pageX + 20;
        let y = e.pageY + 20;

        // evitar que se salga de pantalla
        if (x + 520 > window.innerWidth) x = e.pageX - 520;
        if (y + 520 > window.innerHeight) y = e.pageY - 520;

        preview.style.left = x + "px";
        preview.style.top = y + "px";
    });

    img.addEventListener("mouseleave", () => {
        preview.style.display = "none";
    });

});
</script>

</body>
</html>
