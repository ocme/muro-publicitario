<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Muro Publicitario</title>

<style>
body{
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}

h1{
    margin: 20px;
}

.grid{
    display: grid;
    grid-template-columns: repeat(10, 100px);
    gap: 4px;
    justify-content: center;
}

.ad{
    width: 100px;
    height: 100px;
    background: #333;
    border: 1px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
}

.ad img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.available{
    background: #1e1e1e;
    color: #00ff88;
    cursor: pointer;
}

.buy{
    display: inline-block;
    margin: 25px;
    padding: 15px 30px;
    background: #00ff88;
    color: black;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🔥 Muro Publicitario 🔥</h1>
<p>Compra tu espacio desde $5.000 COP</p>

<div class="grid">

<!-- EJEMPLOS OCUPADOS -->
<a href="https://google.com" class="ad">
<img src="https://via.placeholder.com/50">
</a>

<a href="https://instagram.com" class="ad">
<img src="https://via.placeholder.com/50">
</a>
    
<a href="https://instagram.com" class="ad">
<img src="https://i.imgur.com/DfUFSE1.jpeg">
</a>
    
<!-- ESPACIOS DISPONIBLES -->
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>
<div class="ad available">Disponible</div>

</div>

<a class="buy" href="#">Comprar espacio</a>

</body>
</html>
